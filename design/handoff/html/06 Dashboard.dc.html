<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e6e7ea;font-family:Inter,system-ui,sans-serif}a{color:#0f766e}a:hover{color:#0b5049}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:64px;padding:48px;width:max-content">
  <div style="display:flex;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 13px Inter,sans-serif;color:#52525b">06-dashboard · Priya · Pull-through definition open</div>
      <div id="dashboard" data-screen-label="06 Dashboard" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Dashboard Page" persona="priya" hint-size="1440px,900px"></dc-import></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:32px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="font:500 13px Inter,sans-serif;color:#52525b">06-chart-loading · skeleton</div>
        <div id="chart-loading" data-screen-label="06 Chart loading" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Dashboard Page" fragment="loading" hint-size="460px,280px"></dc-import></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="font:500 13px Inter,sans-serif;color:#52525b">06-chart-empty · empty state</div>
        <div id="chart-empty" data-screen-label="06 Chart empty" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Dashboard Page" fragment="empty" hint-size="460px,280px"></dc-import></div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;align-self:flex-start">
    <div style="font:500 13px Inter,sans-serif;color:#52525b">06-dashboard-lo · Alex's loan officer variant</div>
    <div id="dashboard-lo" data-screen-label="06 Dashboard loan officer" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Dashboard Page" persona="alex" hint-size="1440px,900px"></dc-import></div>
  </div>
</div>
</x-dc>
</body>
</html>
