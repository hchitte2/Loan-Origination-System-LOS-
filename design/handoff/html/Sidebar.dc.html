<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[data-theme]{--background:#f7f7f8;--foreground:#18181b;--muted:#efeff1;--muted-foreground:#64687a;--card:#fff;--card-foreground:#18181b;--border:#e4e4e7;--primary:#0f766e;--primary-foreground:#fff;--success:#15803d;--success-foreground:#fff;--warning:#b45309;--warning-foreground:#fff;--destructive:#b91c1c;--destructive-foreground:#fff;--ring:#0f766e;--chart-1:#b3c2bf;--chart-2:#8fd3c9;--chart-3:#4fb8ab;--chart-4:#2a9d90;--chart-5:#0f766e;--chart-6:#0b5049;--radius:6px;--banner:#fcd34d;--banner-fg:#1c1400;--shadow:0 1px 2px rgba(0,0,0,.06);--pop:0 8px 24px rgba(0,0,0,.12)}
[data-theme="dark"]{--background:#141518;--foreground:#ececee;--muted:#24262b;--muted-foreground:#9b9fa8;--card:#1c1d21;--card-foreground:#ececee;--border:#2e3036;--primary:#2aa393;--primary-foreground:#07201d;--success:#4ade80;--success-foreground:#052e16;--warning:#fbbf24;--warning-foreground:#1c1400;--destructive:#f87171;--destructive-foreground:#2a0a0a;--ring:#2dd4bf;--chart-1:#5b6664;--chart-2:#3f8f85;--chart-3:#4fb8ab;--chart-4:#66cbbf;--chart-5:#8fd3c9;--chart-6:#b9e8e1;--shadow:0 1px 2px rgba(0,0,0,.4);--pop:0 8px 24px rgba(0,0,0,.5)}
</style>
</helmet>
<aside data-theme="{{ theme }}" style="width:240px;flex:none;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--border);color:var(--foreground);font-family:Inter,system-ui,sans-serif;position:relative">
  <div style="height:56px;display:flex;align-items:center;padding:0 20px;gap:8px;flex:none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 14h8l3 4 9-12" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-family:Geist,Inter,sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.01em">Clearline</span>
  </div>
  <nav aria-label="Main" style="padding:4px 12px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="2">
      <a href="#" aria-current="{{ n.current }}" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--radius);font-size:14px;font-weight:500;text-decoration:none;color:{{ n.color }};background:{{ n.bg }}" style-hover="background:var(--muted)">{{ n.icon }}<span>{{ n.label }}</span></a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative">
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div role="menu" style="position:absolute;left:12px;right:12px;bottom:92px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--pop);padding:6px;display:flex;flex-direction:column;gap:2px;font-size:13px">
        <div style="padding:6px 8px 4px;font-size:11px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em">Theme</div>
        <div role="radiogroup" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:0 4px 6px">
          <button style="display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:var(--radius);border:1px solid var(--border);background:var(--muted);color:var(--foreground);font:500 12px Inter,sans-serif;cursor:pointer">{{ ic.sun }}Light</button>
          <button style="display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--foreground);font:500 12px Inter,sans-serif;cursor:pointer">{{ ic.moon }}Dark</button>
          <button style="display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--foreground);font:500 12px Inter,sans-serif;cursor:pointer">{{ ic.monitor }}System</button>
        </div>
        <div style="height:1px;background:var(--border);margin:0 -6px 4px"></div>
        <button role="menuitem" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--radius);border:0;background:transparent;color:var(--foreground);font:500 13px Inter,sans-serif;text-align:left;cursor:pointer" style-hover="background:var(--muted)">{{ ic.logOut }}Sign out</button>
      </div>
    </sc-if>
    <button aria-haspopup="menu" style="display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--foreground);text-align:left;cursor:pointer;font-family:Inter,sans-serif" style-hover="background:var(--muted)">
      <span style="width:28px;height:28px;border-radius:50%;background:color-mix(in oklab,var(--primary) 16%,var(--card));color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none">{{ initials }}</span>
      <span style="display:flex;flex-direction:column;min-width:0;flex:1">
        <span style="font-size:13px;font-weight:500;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ name }}</span>
        <span style="font-size:12px;color:var(--muted-foreground);line-height:16px">{{ role }}</span>
      </span>
      <span style="color:var(--muted-foreground)">{{ ic.chevronsUpDown }}</span>
    </button>
    <div style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--radius);border:1px dashed var(--border);color:var(--muted-foreground);font-size:11px;font-weight:500;align-self:flex-start">{{ ic.flaskIcon }}Demo · synthetic data</div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;persona&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;priya&quot;,&quot;alex&quot;,&quot;sam&quot;],&quot;default&quot;:&quot;priya&quot;,&quot;tsType&quot;:&quot;'priya'|'alex'|'sam'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  state = { ic: {} };
  componentDidMount() {
    import('./icons.js').then(m => this.setState({ ic: m.makeIcons(React).i16, ic20: m.makeIcons(React).i20 }));
  }
  renderVals() {
    const p = this.props.persona ?? 'priya';
    const personas = {
      priya: { name: 'Priya Nair', role: 'Superadmin', initials: 'PN', nav: [['Dashboard', 'layoutDashboard'], ['Pipeline', 'kanban'], ['Queue', 'inbox'], ['Users', 'users'], ['Activity', 'activity']] },
      alex: { name: 'Alex Rivera', role: 'Loan officer', initials: 'AR', nav: [['Pipeline', 'kanban'], ['Dashboard', 'layoutDashboard']] },
      sam: { name: 'Sam Okafor', role: 'Processor', initials: 'SO', nav: [['Queue', 'inbox']] },
    };
    const me = personas[p];
    const active = this.props.active ?? me.nav[0][0];
    const i20 = this.state.ic20 || {};
    const ic = Object.assign({ flaskIcon: this.state.ic.info }, this.state.ic);
    return {
      theme: this.props.theme ?? 'light',
      name: me.name, role: me.role, initials: me.initials, ic,
      menuOpen: !!this.props.menuOpen,
      nav: me.nav.map(([label, icon]) => {
        const cur = label === active;
        return { label, current: cur ? 'page' : undefined, icon: i20[icon] || null, color: cur ? 'var(--primary)' : 'var(--foreground)', bg: cur ? 'color-mix(in oklab,var(--primary) 10%,var(--card))' : 'transparent' };
      }),
    };
  }
}
</script>
</body>
</html>
