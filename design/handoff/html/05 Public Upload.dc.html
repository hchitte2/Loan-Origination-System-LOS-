<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e6e7ea;font-family:Inter,system-ui,sans-serif}a{color:#0f766e}a:hover{color:#0b5049}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:64px;padding:48px;width:max-content">
  <div style="display:flex;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 13px Inter,sans-serif;color:#52525b">05-public-mobile-light · 390 wide (full page)</div>
      <div id="public-mobile-light" data-screen-label="05 Public mobile light" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Public Page" theme="light" width="mobile" state="active" hint-size="390px,844px"></dc-import></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 13px Inter,sans-serif;color:#52525b">05-public-mobile-dark</div>
      <div id="public-mobile-dark" data-screen-label="05 Public mobile dark" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Public Page" theme="dark" width="mobile" state="active" hint-size="390px,844px"></dc-import></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 13px Inter,sans-serif;color:#52525b">05-public-done · all-done state</div>
      <div id="public-done" data-screen-label="05 Public done" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Public Page" theme="light" width="mobile" state="done" hint-size="390px,844px"></dc-import></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font:500 13px Inter,sans-serif;color:#52525b">05-public-expired · expired link</div>
      <div id="public-expired" data-screen-label="05 Public expired" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Public Page" theme="light" width="mobile" state="expired" hint-size="390px,844px"></dc-import></div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;align-self:flex-start">
    <div style="font:500 13px Inter,sans-serif;color:#52525b">05-public-desktop · 1440 wide</div>
    <div id="public-desktop" data-screen-label="05 Public desktop" style="box-shadow:0 2px 12px rgba(0,0,0,.08)"><dc-import name="Public Page" theme="light" width="desktop" state="active" hint-size="1440px,900px"></dc-import></div>
  </div>
</div>
</x-dc>
</body>
</html>
