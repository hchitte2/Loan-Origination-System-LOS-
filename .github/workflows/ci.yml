name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The name is what branch protection requires on main; renaming it silently removes
    # the required check and blocks every merge. The db project runs inside this job.
    name: biome · tsc · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm test
      # The db project runs migrations and the seed against pglite, so it needs no
      # external database. It was outside CI while a seed bug broke the borrower token on
      # every loan and the pipeline stayed green.
      - run: pnpm test:db
